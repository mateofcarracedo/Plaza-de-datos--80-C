# Mosquitto 2.0 — broker del Desafío -80 °C (prototipo)
# Sin TLS ni usuarios por ahora: solo para red de confianza.

# --- Conexiones ---
listener 1883
allow_anonymous true

# --- Persistencia ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- Logs ---
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
